# ─────────────────────────────────────────────────────────────
#  biznes.toml — всичко, което машината знае за бизнеса.
#  Тук НЯМА ключове. Ключовете са само в .env.
#  Редовете с „# ПОПЪЛНИ“ са приблизителни: смени ги с истинските числа.
#  `./mashina doktor` казва кои още не са попълнени.
# ─────────────────────────────────────────────────────────────

[biznes]
ime        = "PhysioFix"
kratko     = "PF"                       # префикс в имената на кампании/реклами
grad       = "Пловдив"
adres      = "ул. „Севастопол“ 19, Пловдив"
telefon    = "0884 025 333"
sait       = "https://physiofix.bg"
instagram  = "@physiofix.bg"
uslugi     = ["рехабилитация", "масаж", "рехабилитация у дома", "остеоестетика"]
cel        = "messages"                 # messages | calls | leads — какво броим за „резултат“

# Доказателства, които МОЖЕ да се пишат в реклама (само истински числа).
[dokazatelstva]
google_ocenka  = "5.0"
google_otzivi  = "570"                  # ПОПЪЛНИ: обнови, когато се смени
drugi          = ["Идваме и у дома", "2 кабинета в центъра на Пловдив"]

# ── Unit economics: колко най-много можем да платим ─────────
# Цените са САМО за сметките тук. Никога не влизат в реклама.
[ikonomika]
prihod_nov_pacient_60d   = 75.0   # € приблизително: ~35 € на посещение × ~2.1 посещения на пациент (61% идват 1 път, 14% — 2, 25% — 3+; „Числата на PhysioFix“)
dyal_za_reklama          = 0.35   # каква част от този приход сме готови да дадем за реклама
saobshtenie_kam_chas     = 0.40   # ПОПЪЛНИ: % съобщения, които стават записан час (лист „проследяване“)
chas_kam_doshal          = 0.85   # ПОПЪЛНИ: % записани, които идват (1 − неявили се)
popalneno                = false  # сложи true, когато числата горе са истински

# ── Тестът (партидата) ───────────────────────────────────────
[test]
adseta                   = 3      # ъгли = ad set-ове
banera_na_adset          = 4
video_na_adset           = 1
dneven_budjet_na_adset   = 4.0    # € на ден на ad set (ABO). 3 × 4 € = 12 €/ден за Meta
den_pusk                 = "понеделник"
dni_na_test              = 14

# ── Meta настройки (не са тайни) ─────────────────────────────
[meta]
api_versia          = "v23.0"
destinacia          = "MESSENGER"       # MESSENGER | INSTAGRAM_DIRECT | WHATSAPP
cta                 = "MESSAGE_PAGE"
tekstove_rezhim     = "variacii"        # variacii = 5/5/5 в една реклама; edin = по един текст на реклама
vazrast_min         = 25
vazrast_max         = 65
# Център и радиус на аудиторията. ПОПЪЛНИ точните координати на кабинета (Google Maps → десен клик).
shirina             = 42.1450
dalzhina            = 24.7480
radius_km           = 15

# ── KIE.AI: генериране на снимки, видео и глас ───────────────
# Ключът е в .env (KIE_API_KEY). Моделите могат да се сменят тук без код.
[kie]
api_url          = "https://api.kie.ai"
model_snimka     = "google/nano-banana"          # банери/фонове (поддържа текст на кирилица)
model_redakcia   = "google/nano-banana-edit"     # банер от твоя истинска снимка
model_video      = "veo3_fast"                   # кадри за видеата 9:16
model_glas       = "elevenlabs/text-to-speech-multilingual-v2"
glas             = "Rachel"                      # ПОПЪЛНИ: глас, който звучи добре на български
# Как се пише текстът върху банера:
#   nadpis = машината слага текста сама с шрифта на марката (100% вярна кирилица)
#   ai     = текстът е в промпта и AI го рисува; после проверка буква по буква
tekst_v_banera   = "nadpis"

# ── Цена на генерирането (за Стоп А) ─────────────────────────
# Ориентировъчно в €. Смени с цените от твоя план в Magnific/KIE.
[ceni_generirane]
snimka_ai           = 0.08      # 1 AI изображение (фон/кадър)
video_sekunda_ai    = 0.10      # 1 секунда AI видео
glas_tts            = 0.02      # 1 озвучаване (до ~40 сек)

# ── Марка ────────────────────────────────────────────────────
[marka]
cvqt_osnoven   = "#16351F"   # тъмнозелено
cvqt_akcent    = "#EB6F04"   # оранжево
cvqt_fon       = "#F6F1E8"   # крем
cvqt_tekst_svetal = "#FFFFFF"
shrift_zaglavie = "Montserrat-Black.ttf"
shrift_tekst    = "Manrope-Bold.ttf"
hapche_tekst    = "Запиши час"

# ── Правила за текстовете (Meta здравни правила + желания на собственика) ──
[pravila]
zabraneni_ceni   = true     # никакви цени, евро, лева, отстъпки в реклами
zabraneni_dumi   = [
  "излекува", "излекуваме", "гарантира", "гарантирано", "100%", "чудо",
  "преди и след", "преди/след", "веднага изчезва", "завинаги",
  "само днес", "последни места", "бързай", "ограничен брой",
  "теб те боли", "боли ли те", "болят ли те", "страдаш ли", "имаш ли болки",
]
zabraneni_nachala = ["Здравейте, ние сме", "В това видео ще ви покажа", "Днес ще ви дам"]
